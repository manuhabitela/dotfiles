backend = "glx";

glx-no-stencil = true;
glx-copy-from-front = false;

shadow = true;
shadow-radius = 20;
shadow-offset-x = -20;
shadow-offset-y = -10;
shadow-opacity = 0.5;

fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

vsync = true;
dbe = false;
unredir-if-possible = false;

detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-client-opacity = true;

xrender-sync-fence = true;

# All window rules
rules = (
  # Default rules
  {
    match = "class_g != 'null'";  # Matches all windows
    fade = false;
    shadow = true;
    opacity = 1;
    corner-radius = 16 ;
  },
  {
    match = "window_type = 'utility'";
    shadow = false;
  },
  {
    match = "window_type = 'popup_menu'";
    shadow = false;
  },
  {
    match = "window_type = 'menu'";
    shadow = false;
  },
  {
    match = "window_type = 'dropdown_menu'";
    shadow = false;
  },
  {
    match = "class_i ^= 'rofi'";
    corner-radius = 0;
  },
  {
    match = "class_g = 'warpd'";
    corner-radius = 0;
  },
  # Shadow rules
  # {
  #   match = "_NET_WM_WINDOW_TYPE = '_NET_WM_WINDOW_TYPE_NOTIFICATION'";
  #   shadow = false;
  # },
  {
    match = "_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'";
    shadow = false;
  },
  # {
  #   match = "_GTK_FRAME_EXTENTS";
  #   shadow = false;
  # },
  # # Menu shadow rules
  # {
  #   match = "window_type = 'menu'";
  #   shadow = false;
  # },
  # {
  #   match = "window_type = 'dropdown_menu'";
  #   shadow = false;
  # },
  # {
  #   match = "window_type = 'popup_menu'";
  #   shadow = false;
  # },
  # {
  #   match = "window_type = 'tooltip'";
  #   shadow = false;
  # },
  # Dunst rules
  {
    match = "class_g = 'Dunst'";
    fade = true;
    shadow = true;
  },
  # Awesome drawin rules
  {
    match = "name = 'Awesome drawin'";
    corner-radius = 0;
  },
  # Window manager rules
  {
    match = "wmwin";
    focus = true;
  },
  {
    match = "override_redirect";
    focus = true;
  }
);